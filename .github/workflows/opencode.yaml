name: opencode

permissions:
  id-token: write
  contents: read

# Explicit bash adds -o pipefail, so a failing command piped into awk still fails its step
defaults:
  run:
    shell: bash

# Runs when an issue gets the "opencode" label (also when it's created with it). Issue comments never start a run.
on:
  issues:
    types: [labeled]

jobs:
  apply:
    name: Implement issue
    if: github.event.label.name == 'opencode'
    runs-on: ubuntu-26.04
    env:
      GH_REPO: ${{ github.repository }}
      ISSUE: ${{ github.event.issue.number }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
      BRANCH: opencode/issue-${{ github.event.issue.number }}-${{ github.run_id }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # Same exchange opencode github run does: the run's OIDC token for an opencode app installation token,
      # so the PR and pushes come from the app and still trigger CI
      - name: Get opencode app token
        run: |-
          oidc=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=opencode-github-action" | jq -r .value)
          token=$(curl -sSf -X POST -H "Authorization: Bearer $oidc" \
            https://api.opencode.ai/exchange_github_app_token | jq -r .token)
          echo "::add-mask::$token"
          echo "GH_TOKEN=$token" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          # opencode sets its own git auth header; stored checkout credentials would send a second one
          persist-credentials: false
      - name: Open draft pull request
        run: |-
          git config user.name "opencode-agent[bot]"
          git config user.email "opencode-agent[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          # [skip ci] keeps CI from running on the empty draft PR; the real commit below runs it
          git commit --allow-empty -m "opencode: start work on #${ISSUE} [skip ci]"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${auth}" push origin "$BRANCH"
          pr=$(gh pr create --draft --head "$BRANCH" --title "$ISSUE_TITLE" --body "Closes #${ISSUE}")
          gh issue comment "$ISSUE" --body "opencode is working on this in $pr ([run]($RUN_URL))"
          echo "PR_URL=$pr" >> "$GITHUB_ENV"
      - name: Install opencode
        run: |-
          curl -fsSL https://opencode.ai/install | bash -s -- --version 1.19.5
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
      # opencode github run picks its behaviour from the triggering event. Hand it a pull_request event for the
      # draft PR, so it works on that branch: commits, pushes and comments its answer on the PR
      - name: Prepare pull_request event
        run: |-
          gh api "repos/${GH_REPO}/pulls/${PR_URL##*/}" |
            jq '{action: "opened", number, pull_request: ., repository: .base.repo, sender: .user}' > "$RUNNER_TEMP/pr-event.json"
      - name: Run opencode
        env:
          GH_TOKEN: ""
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          MODEL: opencode-go/deepseek-v4.1-flash
          PROMPT: |-
            Implement GitHub issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}

            ${{ github.event.issue.body }}
        # Set inline: a step's env can't override GITHUB_* variables
        run: |-
          GITHUB_EVENT_NAME=pull_request GITHUB_EVENT_PATH="$RUNNER_TEMP/pr-event.json" opencode github run 2>&1 |
            awk -f .github/opencode-log-filter.awk
      - name: Mark ready for review
        run: |-
          if [ "$(gh pr view "$PR_URL" --json commits --jq '.commits | length')" -gt 1 ]; then
            gh pr ready "$PR_URL"
          fi
      - name: Report failure
        if: failure() && env.PR_URL != ''
        run: gh pr comment "$PR_URL" --body "opencode failed, see the [run]($RUN_URL)"
