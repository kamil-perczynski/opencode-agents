services:
  server:
    build: .
    container_name: my_server
    ports:
      - "8080:8080"
    depends_on:
      - redis
    env_file:
      - .env
    environment:
      APP_PROFILES: docker
      OPENCODE_CONFIGSYNC_ENABLED: "true"
      OPENCODE_CONFIGSYNC_REPOURL: "git@github.com:org/opencode-config.git"
      OPENCODE_CONFIGSYNC_SSH_PRIVATEKEYPATH: "/run/secrets/ssh-key"
    volumes:
      - ./secrets/ssh-key:/run/secrets/ssh-key:ro
      - opencode-data/.ssh:/var/opencode-agents/.ssh
  redis:
    image: redis:8-alpine
    container_name: redis_server
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
  redisinsight:
    image: redis/redisinsight:latest
    ports:
      - "5540:5540"
    volumes:
      - redisinsight_data:/data
    restart: unless-stopped
volumes:
  redis_data:
  redisinsight_data:
  opencode_config: