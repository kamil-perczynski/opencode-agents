name: opencode

permissions:
  id-token: write
  contents: read

# Explicit bash adds -o pipefail, so a failing opencode piped into awk still fails its step
defaults:
  run:
    shell: bash

# Runs when an issue gets the "opencode" label (also when it's created with it). Issue comments never start a run.
on:
  issues:
    types: [labeled]

jobs:
  apply:
    name: Implement issue
    if: github.event.label.name == 'opencode'
    runs-on: ubuntu-26.04
    env:
      BRANCH: opencode/issue-${{ github.event.issue.number }}-${{ github.run_id }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # Same exchange opencode github run does: the run's OIDC token for an opencode app installation token,
      # so the PR and commits come from the app and still trigger CI
      - name: Get opencode app token
        uses: actions/github-script@v9
        with:
          script: |
            const oidc = await core.getIDToken('opencode-github-action')
            const res = await fetch('https://api.opencode.ai/exchange_github_app_token', {
              method: 'POST',
              headers: { Authorization: `Bearer ${oidc}` },
            })
            if (!res.ok) throw new Error(`App token exchange failed: ${res.status} ${await res.text()}`)
            const { token } = await res.json()
            core.setSecret(token)
            core.exportVariable('APP_TOKEN', token)
      # Opens the draft PR on an empty "[skip ci]" commit, so CI doesn't run until opencode pushes real changes.
      # Also writes the pull_request event opencode github run reads: given one, it works on that PR's branch
      - name: Open draft pull request
        uses: actions/github-script@v9
        with:
          github-token: ${{ env.APP_TOKEN }}
          script: |
            const { owner, repo } = context.repo
            const { issue, repository, sender } = context.payload
            const base = repository.default_branch
            const branch = process.env.BRANCH

            const { data: head } = await github.rest.repos.getBranch({ owner, repo, branch: base })
            const { data: commit } = await github.rest.git.createCommit({
              owner, repo,
              message: `opencode: start work on #${issue.number} [skip ci]`,
              tree: head.commit.commit.tree.sha,
              parents: [head.commit.sha],
            })
            await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${branch}`, sha: commit.sha })
            const { data: pr } = await github.rest.pulls.create({
              owner, repo, base, head: branch, draft: true, title: issue.title, body: `Closes #${issue.number}`,
            })
            await github.rest.issues.createComment({
              owner, repo, issue_number: issue.number,
              body: `opencode is working on this in ${pr.html_url} ([run](${process.env.RUN_URL}))`,
            })

            const event = { action: 'opened', number: pr.number, pull_request: pr, repository, sender }
            require('fs').writeFileSync(`${process.env.RUNNER_TEMP}/pr-event.json`, JSON.stringify(event))
            core.exportVariable('PR_NUMBER', pr.number)
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          # opencode sets its own git auth header; stored checkout credentials would send a second one
          persist-credentials: false
      # Same Java and Gradle setup as cicd.yaml, so opencode can build and test its changes
      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-home-cache-includes: |
            caches
            notifications
            wrapper
          # Reuse the cache CI saves on main; issue-triggered runs only get read access to the Actions cache
          cache-read-only: true
      - name: Install opencode
        run: |-
          curl -fsSL https://opencode.ai/install | bash -s -- --version 1.19.5
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
      - name: Run opencode
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          MODEL: opencode-go/deepseek-v4.1-flash
          PROMPT: |-
            Implement GitHub issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}

            ${{ github.event.issue.body }}
        # Set inline: a step's env can't override GITHUB_* variables
        run: |-
          GITHUB_EVENT_NAME=pull_request GITHUB_EVENT_PATH="$RUNNER_TEMP/pr-event.json" opencode github run 2>&1 |
            awk -f .github/opencode-log-filter.awk
      - name: Mark ready for review
        uses: actions/github-script@v9
        with:
          github-token: ${{ env.APP_TOKEN }}
          script: |
            const { owner, repo } = context.repo
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: Number(process.env.PR_NUMBER) })
            // Only the empty "[skip ci]" commit means opencode changed nothing; leave the PR as a draft then
            if (pr.commits > 1) {
              await github.graphql(
                'mutation($id: ID!) { markPullRequestReadyForReview(input: { pullRequestId: $id }) { clientMutationId } }',
                { id: pr.node_id },
              )
            }
      - name: Report failure
        if: failure() && env.PR_NUMBER != ''
        uses: actions/github-script@v9
        with:
          github-token: ${{ env.APP_TOKEN }}
          script: |
            const { owner, repo } = context.repo
            await github.rest.issues.createComment({
              owner, repo, issue_number: Number(process.env.PR_NUMBER),
              body: `opencode failed, see the [run](${process.env.RUN_URL})`,
            })
