name: opencode

permissions:
  id-token: write
  contents: read

on:
  issue_comment:
    types: [created]

jobs:
  apply:
    name: Apply changes
    # opencode ends every reply with a "[github run](...)" footer; skip those so its own replies can't re-trigger it
    if: >-
      (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode')) &&
      !contains(github.event.comment.body, '[github run](') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      # Same steps as anomalyco/opencode/github, run inline so the output can be filtered
      - name: Install opencode
        run: |-
          curl -fsSL https://opencode.ai/install | bash -s -- --version 1.19.5
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
      - name: Run opencode
        # No GitHub token: opencode swaps the run's OIDC token for an opencode app installation token
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          MODEL: opencode-go/deepseek-v4.1-flash
        run: opencode github run 2>&1 | awk -f .github/opencode-log-filter.awk
