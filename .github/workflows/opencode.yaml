name: opencode

permissions:
  contents: read

on:
  issue_comment:
    types: [created]

jobs:
  apply:
    name: Apply changes
    # Only comments that start with the mention, so opencode's own replies can't re-trigger it
    if: >-
      (startsWith(github.event.comment.body, '/oc') || startsWith(github.event.comment.body, '/opencode')) &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          token: ${{ secrets.OPENCODE_GITHUB_PAT }}
      - name: Configure git user
        env:
          GH_TOKEN: ${{ secrets.OPENCODE_GITHUB_PAT }}
        run: |-
          login=$(gh api user --jq .login)
          id=$(gh api user --jq .id)
          git config --global user.name "${login}"
          git config --global user.email "${id}+${login}@users.noreply.github.com"
      # Same steps as anomalyco/opencode/github, run inline so the output can be filtered
      - name: Install opencode
        run: |-
          curl -fsSL https://opencode.ai/install | bash -s -- --version 1.19.5
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
      - name: Run opencode
        env:
          GITHUB_TOKEN: ${{ secrets.OPENCODE_GITHUB_PAT }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          MODEL: opencode-go/deepseek-v4.1-flash
          USE_GITHUB_TOKEN: "true"
        run: opencode github run 2>&1 | awk -f .github/opencode-log-filter.awk
