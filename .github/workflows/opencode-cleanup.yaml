name: opencode-cleanup

permissions:
  actions: write

# GitHub records a run for every issue comment, even when the opencode job is skipped.
# Delete those skipped runs, plus this workflow's own earlier runs, to keep the Actions list clean.
on:
  workflow_run:
    workflows: [opencode]
    types: [completed]

jobs:
  cleanup:
    name: Delete skipped opencode runs
    runs-on: ubuntu-26.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Delete skipped opencode run
        if: github.event.workflow_run.conclusion == 'skipped'
        run: gh run delete ${{ github.event.workflow_run.id }} || true
      - name: Delete earlier cleanup runs
        run: |-
          gh run list --workflow opencode-cleanup.yaml --status completed --limit 100 --json databaseId --jq '.[].databaseId' |
            xargs -r -n1 gh run delete || true
